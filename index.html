<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>DJ CIOKO LIVE STUDIO</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#050505;
    color:white;
    min-height:100vh;
}

header{
    text-align:center;
    padding:20px;
    background:#111;
    border-bottom:2px solid #FFD700;
}

header h1{
    color:#FFD700;
    letter-spacing:2px;
}

.container{
    max-width:1200px;
    margin:auto;
    padding:20px;
}

.preview{
    position:relative;
    width:100%;
    max-width:900px;
    margin:auto;
    border-radius:20px;
    overflow:hidden;
    border:3px solid #FFD700;
}

.background{
    width:100%;
    height:600px;
    object-fit:cover;
    display:block;
}

video{
    position:absolute;
    width:280px;
    right:20px;
    bottom:20px;
    border-radius:15px;
    border:3px solid white;
    background:black;
}

.logo{
    position:absolute;
    top:15px;
    left:15px;
    background:rgba(0,0,0,.7);
    padding:10px 20px;
    border-radius:12px;
    color:#FFD700;
    font-weight:bold;
}

.controls{
    display:flex;
    justify-content:center;
    gap:15px;
    flex-wrap:wrap;
    margin-top:25px;
}

button{
    background:#FFD700;
    border:none;
    padding:12px 20px;
    border-radius:10px;
    cursor:pointer;
    font-weight:bold;
}

button:hover{
    opacity:.9;
}

.scenes{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:15px;
    margin-top:30px;
}

.scene-card{
    cursor:pointer;
    background:#111;
    border-radius:15px;
    overflow:hidden;
    border:2px solid transparent;
    transition:.3s;
}

.scene-card:hover{
    border-color:#FFD700;
}

.scene-card img{
    width:100%;
    height:150px;
    object-fit:cover;
}

.scene-card h3{
    text-align:center;
    padding:10px;
}

footer{
    text-align:center;
    margin-top:30px;
    padding:20px;
    color:#999;
}
</style>
</head>

<body>

<header>
    <h1>DJ CIOKO LIVE STUDIO</h1>
</header>

<div class="container">

    <div class="preview">

        <img
            id="bg"
            class="background"
            src="images/festival.jpg"
            alt="Background">

        <div class="logo">
            DJ CIOKO
        </div>

        <video
            id="camera"
            autoplay
            muted
            playsinline>
        </video>

    </div>

    <div class="controls">
        <button onclick="startCamera()">
            Pornește Camera
        </button>
    </div>

    <div class="scenes">

        <div class="scene-card" onclick="changeBackground('images/festival.jpg')">
            <img src="images/festival.jpg">
            <h3>Festival Stage</h3>
        </div>

        <div class="scene-card" onclick="changeBackground('images/dj-booth.jpg')">
            <img src="images/dj-booth.jpg">
            <h3>DJ Booth</h3>
        </div>

        <div class="scene-card" onclick="changeBackground('images/party.jpg')">
            <img src="images/party.jpg">
            <h3>Party Night</h3>
        </div>

    </div>

</div>

<footer>
    © DJ CIOKO LIVE STUDIO
</footer>

<script>

const camera = document.getElementById("camera");

async function startCamera(){

    try{

        const stream = await navigator.mediaDevices.getUserMedia({
            video:true,
            audio:true
        });

        camera.srcObject = stream;

    }catch(error){

        alert("Nu s-a putut porni camera.");

    }
}

function changeBackground(image){

    document.getElementById("bg").src = image;

}

</script>

</body>
</html>
